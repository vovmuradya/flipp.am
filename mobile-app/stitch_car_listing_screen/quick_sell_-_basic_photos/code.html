<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Quick Sell - Basic Photos</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
      .material-symbols-outlined {
        font-variation-settings:
        'FILL' 0,
        'wght' 400,
        'GRAD' 0,
        'opsz' 24
      }
    </style>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#ec3713",
              "background-light": "#f8f6f6",
              "background-dark": "#221310",
            },
            fontFamily: {
              "display": ["Manrope", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative flex min-h-screen w-full flex-col">
<!-- Top App Bar -->
<header class="flex items-center p-4 pb-2 justify-between sticky top-0 z-10 bg-background-light dark:bg-background-dark">
<button class="flex size-10 shrink-0 items-center justify-center rounded-full text-white">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<h1 class="text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center">Basic Photos</h1>
<div class="w-10"></div> <!-- Spacer for centering title -->
</header>
<!-- Page Indicators -->
<div class="flex w-full flex-row items-center justify-center gap-2 py-4 px-4">
<div class="h-1 flex-1 rounded-full bg-primary/30"><div class="h-1 w-full rounded-full bg-primary"></div></div>
<div class="h-1 flex-1 rounded-full bg-primary"></div>
<div class="h-1 flex-1 rounded-full bg-primary/30"></div>
<div class="h-1 flex-1 rounded-full bg-primary/30"></div>
</div>
<main class="flex-1 px-4">
<!-- Headline Text -->
<h2 class="text-white tracking-tight text-[32px] font-bold leading-tight text-left pb-2 pt-4">Upload Your Car's Photos</h2>
<!-- Body Text -->
<p class="text-white/70 text-base font-normal leading-normal pb-6">Add at least 3 photos to get started. Front, back, and interior views work best.</p>
<!-- Photo Upload Area with Thumbnails -->
<div class="grid grid-cols-2 gap-4">
<!-- Uploaded Photo 1 with Cover Badge -->
<div class="relative aspect-square group">
<img class="h-full w-full object-cover rounded-xl" data-alt="Front view of a yellow sports car" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCfphYzMhEUqmG3Mo_CFMPMkG7rXhdiWBGExpkjoXamltTpoeTofVA-LYRymtYXclxsoE58ZmznPzumcqw9BJetGwC07CMdQImkija_tS-NGU8_4VaX8F4Qw6T1_guessw5VlrDngoQK4m6cGYBj5y2hcBXYacy71D_u5vYjyngTrvYtLONWRPfvM_uNSHoO_DorMtnY7TQO1xtX9p2pw9jGSO5t8q8T23INxQcynwSZ5A2vuMLfE6W6NvdOZ5wOPfEQTpdohklLg"/>
<button class="absolute top-2 right-2 flex size-6 items-center justify-center rounded-full bg-black/50 text-white backdrop-blur-sm transition-opacity group-hover:opacity-100 opacity-100">
<span class="material-symbols-outlined text-base">close</span>
</button>
<div class="absolute bottom-2 left-2 rounded-full bg-black/60 px-2 py-0.5 text-xs font-bold text-white backdrop-blur-sm">Cover</div>
</div>
<!-- Uploaded Photo 2 -->
<div class="relative aspect-square group">
<img class="h-full w-full object-cover rounded-xl" data-alt="Interior view of a luxury car dashboard" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAwoBcrM3dGrzFQd3fFErIlC1zpEQ4MCECJ2NwSFJLWQzmtGYJ8q5R31i0Ldm1j1JKsvnEdnIeiL92MGwRqa-H0vrfw2hG05mMEQFX-wonF0EYhPnffUXvlnq-I1aVr-KTaC-Loh-H04sx39__kRlml3Yw--Rb5romAAF-Wz9W4EKWoTTwGo_hNcOvJDNVHhnt7WDe7PuBdOGyo4O6kDky8QcOkmG0BzTm-zLsiPqJ7WrchEjHP4f_Xy-A7UWCDQ2a2BOCnP1tfNg"/>
<button class="absolute top-2 right-2 flex size-6 items-center justify-center rounded-full bg-black/50 text-white backdrop-blur-sm transition-opacity group-hover:opacity-100 opacity-100">
<span class="material-symbols-outlined text-base">close</span>
</button>
</div>
<!-- Uploaded Photo 3 -->
<div class="relative aspect-square group">
<img class="h-full w-full object-cover rounded-xl" data-alt="Rear view of a modern sports car" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC8J84QRR1xD8zPC9S26FPYoy5Hz5oDpf3XrPvsg4LckGW8A3cu2H9m4beKmjGrfJpIn1p8Cee0JSmMIEzSVXfuxgubhE6b2eJlbJVjrwe7B3HJQIPp2bwxA63wbyJ3eku7Qvov5LwA6s74rZ5T-w02-IBzAY9cIyggotAmnRB1nShUCZxD6qhIHU5giU5E3hSMPXBQ-t4mat41DH6ndZ56fPnUXmCZAkUsrJcHA5CqAhg_EKi3lHxkoEn3tSHCCBzcIwOYZ2Svjg"/>
<button class="absolute top-2 right-2 flex size-6 items-center justify-center rounded-full bg-black/50 text-white backdrop-blur-sm transition-opacity group-hover:opacity-100 opacity-100">
<span class="material-symbols-outlined text-base">close</span>
</button>
</div>
<!-- Empty State for adding more photos -->
<div class="flex aspect-square flex-col items-center justify-center gap-3 rounded-xl border-2 border-dashed border-primary/30 p-4 hover:bg-primary/10 transition-colors cursor-pointer">
<div class="flex size-10 items-center justify-center rounded-full bg-primary/20 text-primary">
<span class="material-symbols-outlined">add_a_photo</span>
</div>
<p class="text-white text-base font-bold leading-tight text-center">Add More Photos</p>
</div>
</div>
</main>
<!-- Footer with CTA -->
<footer class="sticky bottom-0 bg-background-light dark:bg-background-dark p-4 pt-6">
<button class="flex w-full min-w-[84px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-4 bg-primary text-white text-base font-bold leading-normal tracking-wide">
<span class="truncate">Next</span>
</button>
</footer>
</div>
</body></html>

<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Quick Sell - Basic Vehicle Info</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#ec3713",
              "background-light": "#f8f6f6",
              "background-dark": "#121212",
              "surface-dark": "#221310",
              "text-primary-dark": "#EAEAEA",
              "text-secondary-dark": "#8A8A8E",
              "border-dark": "#673b32",
            },
            fontFamily: {
              "display": ["Manrope", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            font-size: 24px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative flex h-screen w-full flex-col">
<!-- Top App Bar -->
<div class="flex items-center bg-background-light dark:bg-background-dark p-4 pb-2 justify-between sticky top-0 z-10">
<div class="flex size-12 shrink-0 items-center justify-start">
<span class="material-symbols-outlined text-text-primary-dark">close</span>
</div>
<h2 class="text-text-primary-dark text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center">Basic Vehicle Info</h2>
<div class="flex size-12 shrink-0 items-center"></div> <!-- Spacer for centering title -->
</div>
<div class="flex flex-1 flex-col overflow-y-auto px-4">
<!-- Progress Bar -->
<div class="flex flex-col gap-3 py-4">
<p class="text-text-secondary-dark text-sm font-medium leading-normal">Step 1 of 3</p>
<div class="rounded-full bg-surface-dark h-2"><div class="h-2 rounded-full bg-primary" style="width: 33%;"></div></div>
</div>
<!-- Form Fields -->
<div class="flex flex-col gap-6 pt-4">
<!-- Make -->
<label class="flex flex-col w-full">
<p class="text-text-secondary-dark text-base font-medium leading-normal pb-2">Make</p>
<div class="relative flex w-full flex-1 items-stretch rounded-lg">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-text-primary-dark focus:outline-none focus:ring-1 focus:ring-primary border border-border-dark bg-surface-dark h-14 placeholder:text-text-secondary-dark p-4 pr-12 text-base font-normal leading-normal" placeholder="Select Make" value=""/>
<div class="absolute inset-y-0 right-0 text-text-secondary-dark flex items-center pr-4 pointer-events-none">
<span class="material-symbols-outlined">unfold_more</span>
</div>
</div>
</label>
<!-- Model -->
<label class="flex flex-col w-full">
<p class="text-text-secondary-dark text-base font-medium leading-normal pb-2">Model</p>
<div class="relative flex w-full flex-1 items-stretch rounded-lg">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-text-primary-dark focus:outline-none focus:ring-1 focus:ring-primary border border-border-dark bg-surface-dark h-14 placeholder:text-text-secondary-dark p-4 pr-12 text-base font-normal leading-normal" placeholder="Select Model" value=""/>
<div class="absolute inset-y-0 right-0 text-text-secondary-dark flex items-center pr-4 pointer-events-none">
<span class="material-symbols-outlined">unfold_more</span>
</div>
</div>
</label>
<!-- Year -->
<label class="flex flex-col w-full">
<p class="text-text-secondary-dark text-base font-medium leading-normal pb-2">Year</p>
<div class="relative flex w-full flex-1 items-stretch rounded-lg">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-text-primary-dark focus:outline-none focus:ring-1 focus:ring-primary border border-border-dark bg-surface-dark h-14 placeholder:text-text-secondary-dark p-4 pr-12 text-base font-normal leading-normal" placeholder="Select Year" value=""/>
<div class="absolute inset-y-0 right-0 text-text-secondary-dark flex items-center pr-4 pointer-events-none">
<span class="material-symbols-outlined">unfold_more</span>
</div>
</div>
</label>
<!-- Description -->
<label class="flex flex-col w-full">
<p class="text-text-secondary-dark text-base font-medium leading-normal pb-2">Description</p>
<div class="relative flex w-full flex-1 flex-col items-stretch rounded-lg">
<textarea class="form-textarea flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-text-primary-dark focus:outline-none focus:ring-1 focus:ring-primary border border-border-dark bg-surface-dark h-32 placeholder:text-text-secondary-dark p-4 text-base font-normal leading-normal" placeholder="Briefly describe your vehicle's condition..."></textarea>
<p class="text-right text-text-secondary-dark text-sm pt-2">0/250</p>
</div>
</label>
</div>
</div>
<!-- Next Button -->
<div class="p-4 pt-2 bg-background-light dark:bg-background-dark sticky bottom-0 z-10">
<button class="flex w-full items-center justify-center rounded-lg bg-primary h-14 text-white text-base font-bold leading-normal transition-opacity hover:opacity-90">Next</button>
</div>
</div>
</body></html>

<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Quick Sell - Contact &amp; Price</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#ec3713",
              "background-light": "#f8f6f6",
              "background-dark": "#121212",
              "surface-dark": "#1E1E1E",
              "text-primary-dark": "#E0E0E0",
              "text-secondary-dark": "#8A8A8D",
              "border-dark": "#2d2d2d",
            },
            fontFamily: {
              "display": ["Manrope", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            font-size: 24px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative flex h-screen w-full flex-col">
<!-- Top App Bar -->
<div class="flex items-center bg-background-light dark:bg-background-dark p-4 pb-2 justify-between sticky top-0 z-10">
<div class="flex size-12 shrink-0 items-center justify-start text-text-primary-dark">
<span class="material-symbols-outlined">arrow_back_ios_new</span>
</div>
<h2 class="flex-1 text-center text-lg font-bold leading-tight tracking-[-0.015em] text-text-primary-dark -ml-12">Contact &amp; Price</h2>
<!-- Empty div for alignment -->
<div class="w-12"></div>
</div>
<!-- Page Indicators -->
<div class="flex w-full flex-row items-center justify-center gap-3 py-5 px-4">
<div class="h-1 flex-1 rounded-full bg-primary/30"></div>
<div class="h-1 flex-1 rounded-full bg-primary/30"></div>
<div class="h-1 flex-1 rounded-full bg-primary"></div>
</div>
<!-- Main Content -->
<main class="flex-1 overflow-y-auto px-4">
<div class="flex flex-col gap-6 pt-2">
<!-- Selling Price TextField -->
<div class="flex flex-col">
<label class="text-text-secondary-dark text-base font-medium leading-normal pb-2" for="selling-price">Selling Price</label>
<div class="relative">
<span class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-4 text-text-primary-dark">$</span>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-text-primary-dark focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-border-dark bg-surface-dark h-14 placeholder:text-text-secondary-dark pl-8 p-4 text-base font-normal leading-normal" id="selling-price" inputmode="decimal" placeholder="0.00" type="number"/>
</div>
</div>
<!-- Phone Number TextField -->
<div class="flex flex-col">
<label class="text-text-secondary-dark text-base font-medium leading-normal pb-2" for="phone-number">Phone Number</label>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-text-primary-dark focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-border-dark bg-surface-dark h-14 placeholder:text-text-secondary-dark p-4 text-base font-normal leading-normal" id="phone-number" type="tel" value=""/>
</div>
<!-- Email Address TextField -->
<div class="flex flex-col">
<label class="text-text-secondary-dark text-base font-medium leading-normal pb-2" for="email-address">Email Address</label>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-text-primary-dark focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-border-dark bg-surface-dark h-14 placeholder:text-text-secondary-dark p-4 text-base font-normal leading-normal" id="email-address" type="email" value="user@example.com"/>
</div>
<!-- Helper Text -->
<p class="text-center text-xs text-text-secondary-dark pt-2">Your contact details will only be shared with interested buyers.</p>
</div>
</main>
<!-- Bottom Action Bar -->
<div class="sticky bottom-0 bg-background-light dark:bg-background-dark p-4 pb-8">
<button class="flex w-full items-center justify-center rounded-xl bg-primary px-6 py-4 text-base font-bold text-white shadow-lg shadow-primary/20 hover:bg-opacity-90">
                Publish Listing
            </button>
</div>
</div>
</body></html>

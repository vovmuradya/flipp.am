<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Add Listing - Vehicle Details</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#ec3713",
            "background-light": "#f8f6f6",
            "background-dark": "#121212",
            "card-dark": "#1E1E1E",
            "card-light": "#FFFFFF",
            "text-primary-light": "#121212",
            "text-primary-dark": "#EAEAEA",
            "text-secondary-light": "#6B7280",
            "text-secondary-dark": "#A0A0A0",
          },
          fontFamily: {
            "display": ["Manrope", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.5rem",
            "lg": "0.75rem",
            "xl": "1rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
<style>body {
    min-height: max(884px, 100dvh)
    }
.form-select {
    background-image: url(https://lh3.googleusercontent.com/aida-public/AB6AXuAx4yroQQxFvu4T-IHsILiGYcjOArufFEYrPRdDVoQHd02-0gsJCMxFN9V0oGkVIkd6el8AdC5y0O_rQRu1JHW37eAIAcjXUDGV-oRj_R1Jt_7i7x5zK3XeWADfW9fPvfodYk0OwAsSQRxdGWVdHhntKhOEZknAQNW29pTkvGm-TdU-oHKpf4BktpMAZulzt8pLAfewF5_vNOzpVa8Tz3yO3V_7MNZsBKSGZh44SvZFVOgwHbeHkpzOtRWIorvQsiS4BZHzUmUNCw);
    background-position: right 0.75rem center;
    background-repeat: no-repeat;
    background-size: 1.5em 1.5em;
    padding-right: 2.5rem;
    -webkit-appearance: none;
    -moz-appearance: none;
    appearance: none
    }</style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative flex min-h-screen w-full flex-col group/design-root overflow-x-hidden text-text-primary-light dark:text-text-primary-dark">
<div class="flex sticky top-0 z-10 items-center bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-sm p-4 justify-between border-b border-white/10">
<div class="flex w-12 items-center justify-start">
<span class="material-symbols-outlined text-3xl">close</span>
</div>
<h2 class="text-lg font-bold">Vehicle Details</h2>
<div class="flex w-12 items-center justify-end">
</div>
</div>
<main class="flex-1 flex flex-col p-4 space-y-6">
<div class="w-full bg-white/10 rounded-full h-1.5">
<div class="bg-primary h-1.5 rounded-full" style="width: 25%"></div>
</div>
<div class="flex flex-col gap-4">
<div class="grid grid-cols-2 gap-4">
<label class="flex flex-col flex-1">
<p class="text-sm font-medium text-text-secondary-light dark:text-text-secondary-dark pb-2">Make</p>
<div class="relative">
<select class="form-select flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-text-primary-light dark:text-text-primary-dark focus:outline-0 focus:ring-2 focus:ring-primary border border-white/10 bg-card-light dark:bg-card-dark h-14 placeholder:text-text-secondary-light dark:placeholder:text-text-secondary-dark p-4 text-base font-normal">
<option selected="">Ford</option>
<option>Toyota</option>
<option>Honda</option>
</select>
</div>
</label>
<label class="flex flex-col flex-1">
<p class="text-sm font-medium text-text-secondary-light dark:text-text-secondary-dark pb-2">Model</p>
<div class="relative">
<select class="form-select flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-text-primary-light dark:text-text-primary-dark focus:outline-0 focus:ring-2 focus:ring-primary border border-white/10 bg-card-light dark:bg-card-dark h-14 placeholder:text-text-secondary-light dark:placeholder:text-text-secondary-dark p-4 text-base font-normal">
<option selected="">Mustang</option>
<option>F-150</option>
<option>Explorer</option>
</select>
</div>
</label>
</div>
<label class="flex flex-col flex-1">
<p class="text-sm font-medium text-text-secondary-light dark:text-text-secondary-dark pb-2">Year</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-text-primary-light dark:text-text-primary-dark focus:outline-0 focus:ring-2 focus:ring-primary border border-white/10 bg-card-light dark:bg-card-dark h-14 placeholder:text-text-secondary-light dark:placeholder:text-text-secondary-dark p-4 text-base font-normal" placeholder="e.g., 2023" type="number"/>
</label>
<label class="flex flex-col flex-1">
<p class="text-sm font-medium text-text-secondary-light dark:text-text-secondary-dark pb-2">Mileage (km)</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-text-primary-light dark:text-text-primary-dark focus:outline-0 focus:ring-2 focus:ring-primary border border-white/10 bg-card-light dark:bg-card-dark h-14 placeholder:text-text-secondary-light dark:placeholder:text-text-secondary-dark p-4 text-base font-normal" placeholder="e.g., 15000" type="number"/>
</label>
<label class="flex flex-col flex-1">
<p class="text-sm font-medium text-text-secondary-light dark:text-text-secondary-dark pb-2">Price ($)</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-text-primary-light dark:text-text-primary-dark focus:outline-0 focus:ring-2 focus:ring-primary border border-white/10 bg-card-light dark:bg-card-dark h-14 placeholder:text-text-secondary-light dark:placeholder:text-text-secondary-dark p-4 text-base font-normal" placeholder="e.g., 45000" type="number"/>
</label>
<div class="grid grid-cols-2 gap-4">
<label class="flex flex-col flex-1">
<p class="text-sm font-medium text-text-secondary-light dark:text-text-secondary-dark pb-2">Body Type</p>
<div class="relative">
<select class="form-select flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-text-primary-light dark:text-text-primary-dark focus:outline-0 focus:ring-2 focus:ring-primary border border-white/10 bg-card-light dark:bg-card-dark h-14 placeholder:text-text-secondary-light dark:placeholder:text-text-secondary-dark p-4 text-base font-normal">
<option selected="">Coupe</option>
<option>Sedan</option>
<option>SUV</option>
<option>Truck</option>
</select>
</div>
</label>
<label class="flex flex-col flex-1">
<p class="text-sm font-medium text-text-secondary-light dark:text-text-secondary-dark pb-2">Fuel Type</p>
<div class="relative">
<select class="form-select flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-text-primary-light dark:text-text-primary-dark focus:outline-0 focus:ring-2 focus:ring-primary border border-white/10 bg-card-light dark:bg-card-dark h-14 placeholder:text-text-secondary-light dark:placeholder:text-text-secondary-dark p-4 text-base font-normal">
<option selected="">Gasoline</option>
<option>Diesel</option>
<option>Electric</option>
<option>Hybrid</option>
</select>
</div>
</label>
</div>
<div class="grid grid-cols-2 gap-4">
<label class="flex flex-col flex-1">
<p class="text-sm font-medium text-text-secondary-light dark:text-text-secondary-dark pb-2">Transmission</p>
<div class="relative">
<select class="form-select flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-text-primary-light dark:text-text-primary-dark focus:outline-0 focus:ring-2 focus:ring-primary border border-white/10 bg-card-light dark:bg-card-dark h-14 placeholder:text-text-secondary-light dark:placeholder:text-text-secondary-dark p-4 text-base font-normal">
<option selected="">Automatic</option>
<option>Manual</option>
</select>
</div>
</label>
<label class="flex flex-col flex-1">
<p class="text-sm font-medium text-text-secondary-light dark:text-text-secondary-dark pb-2">Engine Size (L)</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-text-primary-light dark:text-text-primary-dark focus:outline-0 focus:ring-2 focus:ring-primary border border-white/10 bg-card-light dark:bg-card-dark h-14 placeholder:text-text-secondary-light dark:placeholder:text-text-secondary-dark p-4 text-base font-normal" placeholder="e.g., 5.0" step="0.1" type="number"/>
</label>
</div>
</div>
<div class="flex-grow"></div>
<div class="sticky bottom-0 bg-background-dark py-4">
<button class="flex min-w-[84px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 px-4 bg-primary text-white text-base font-bold w-full disabled:bg-primary/50 disabled:cursor-not-allowed">
<span class="truncate">Next</span>
</button>
</div>
</main>
</div>

</body></html>
